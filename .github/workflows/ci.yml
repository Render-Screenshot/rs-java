name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Generate coverage report
        if: matrix.java == '21'
        run: mvn -B jacoco:report

      - name: Upload coverage to Codecov
        if: matrix.java == '21'
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build package
        run: mvn -B package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-jar
          path: target/*.jar
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # OSV/GitHub Advisory scan of pom.xml, including transitive dependencies.
      # Replaces OWASP dependency-check, which downloaded the full NVD database on cache misses.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.6.0
        run: |
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -sSfL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -sSfL -o osv-scanner_SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 0755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner

      - name: Scan dependencies
        run: osv-scanner scan source -L pom.xml
